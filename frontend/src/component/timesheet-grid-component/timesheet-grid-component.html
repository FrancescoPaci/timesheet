<div class="row mx-3">
  <div class="col-12 min-w-0">
    <select
      class="form-select form-select-sm w-auto"
      aria-label="Seleziona mese"
      [value]="selectedMonth()"
      (change)="onMonthChange($any($event.target).value)"
    >
      @for (m of months; track m.value) {
      <option [value]="m.value">{{ m.label }}</option>
      }
    </select>
  </div>
</div>
<div class="row mx-3">
  <div class="col-12 min-w-0">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
      <h2 class="h4 mb-0 text-capitalize">Timesheet — {{ monthTitle() }}</h2>
      <div class="d-flex align-items-center gap-2">
        <span class="badge text-bg-light border py-2 px-3">
          Totale ore: <strong>{{ totalHours() }}</strong>
        </span>
        <button
          type="button"
          class="btn btn-outline-primary btn-sm"
          (click)="addRow()"
          title="Aggiungi riga"
        >
          + Aggiungi riga
        </button>
        <button
          type="button"
          class="btn btn-success btn-sm"
          (click)="saveTimesheet()"
        >
          Salva
        </button>
      </div>
    </div>

    <div class="table-responsive border rounded">
      <table class="table table-bordered table-sm text-center mb-0 w-auto">
        <thead>
        <tr>
          <td class="table-light fw-semibold text-nowrap px-2">Riga</td>
          <td class="table-light fw-semibold text-nowrap px-2">Progetto</td>
          @for (d of days(); track d.day) {
          <td
            class="fw-bold text-nowrap px-2"
            [class.table-danger]="d.isWeekend"
            [class.table-light]="!d.isWeekend"
          >
            {{ d.label }}
          </td>
          }
        </tr>
        </thead>

        <tbody>
        @for (row of rows(); track row.id; let rowIndex = $index) {
        <tr>
          <td class="table-light fw-semibold text-nowrap px-2">
            <div class="d-flex align-items-center justify-content-center gap-1">
              <span>#{{ rowIndex + 1 }}</span>
              @if (rows().length > 1) {
              <button
                type="button"
                class="btn btn-danger btn-sm py-0 px-1"
                (click)="removeRow(row.id)"
                title="Rimuovi riga"
              >
                <i class="bi bi-x" aria-hidden="true"></i>
              </button>
              }
            </div>
          </td>

          <td class="table-light p-1 text-start">
            <select
              class="form-select form-select-sm project-select"
              [value]="row.projectId ?? ''"
              (change)="updateRowProject(row.id, $any($event.target).value)"
            >
              <option value="">Progetto</option>
              @for (proj of projects(); track proj.id) {
              <option [value]="proj.id">
                {{ proj.code }} - {{ proj.description }}
              </option>
              }
            </select>
          </td>

          @for (d of days(); track d.day) {
          <td class="p-1" [class.table-danger]="d.isWeekend">
            <input
              type="number"
              class="form-control form-control-sm text-end hour-input"
              min="0"
              max="24"
              step="0.5"
              placeholder="Ore"
              [value]="row.hoursByDay[d.day] ?? ''"
              (input)="updateHours(row.id, d.day, $any($event.target).value)"
            />
          </td>
          }
        </tr>
        }
        </tbody>
      </table>
    </div>
  </div>
</div>
