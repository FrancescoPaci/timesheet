<div class="timesheet-toolbar">
  <h2>Timesheet — {{ monthTitle }}</h2>
  <div class="actions">
    <span class="total-badge">Totale ore: <strong>{{ totalHours() }}</strong></span>
    <button type="button" class="btn-add" (click)="addRow()" title="Aggiungi riga">
      + Aggiungi riga
    </button>
    <button type="button" class="btn-save" (click)="saveTimesheet()">
      Salva
    </button>
  </div>
</div>

<div class="table-wrapper">
  <table class="timesheet-table">
    <thead>
    <!-- Riga principale: un <td> per giorno (colspan="2" perché sotto ci sono 2 <td>) -->
    <tr>
      <td class="row-actions-header" colspan="1">Riga</td>
      @for (d of days(); track d.day) {
      <td
        colspan="2"
        class="day-cell"
        [class.weekend]="d.isWeekend"
      >
        {{ d.label }}
      </td>
      }
    </tr>
    </thead>

    <tbody>
    @for (row of rows(); track row.id; let rowIndex = $index) {
    <tr>
      <td class="row-actions-cell">
        <span>#{{ rowIndex + 1 }}</span>
        @if (rows().length > 1) {
        <button
          type="button"
          class="btn-remove"
          (click)="removeRow(row.id)"
          title="Rimuovi riga"
        >
          ×
        </button>
        }
      </td>

      <!-- Due <td> per ogni giorno: 1) input ore, 2) select progetto -->
      @for (d of days(); track d.day) {
      <td class="hours-cell" [class.weekend-tint]="d.isWeekend">
        <input
          type="number"
          class="hours-input"
          min="0"
          max="24"
          step="0.5"
          placeholder="Ore"
          [value]="row.entries[d.day]?.hours ?? ''"
          (input)="updateHours(row.id, d.day, $any($event.target).value)"
        />
      </td>

      <td class="project-cell" [class.weekend-tint]="d.isWeekend">
        <select
          class="project-select"
          [value]="row.entries[d.day]?.projectId ?? ''"
          (change)="updateProject(row.id, d.day, $any($event.target).value)"
        >
          <option value="">Project</option>
          @for (proj of projects(); track proj.id) {
          <option [value]="proj.id">
            {{ proj.code }} - {{ proj.description }}
          </option>
          }
        </select>
      </td>
      }
    </tr>
    }
    </tbody>
  </table>
</div>
